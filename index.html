<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal travel photography journal organized by countries and cities.">
  <title>My Travel Journal</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="data.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="site-header">
      <a class="brand" href="#/">MY <span>TRAVEL JOURNAL</span><span class="brand-period">.</span></a>
      <nav aria-label="主导航">
        <a href="#/" class="nav-link">Destinations</a>
        <a href="mailto:your-email@example.com" class="nav-link" id="contact-link">Contact</a>
      </nav>
    </header>
    <main id="app" tabindex="-1"></main>
    <footer class="footer"><span>© <span id="year"></span> · My Travel Journal</span><span>Made for memories, hosted with GitHub Pages.</span></footer>
  </div>
  <dialog id="lightbox" aria-label="照片预览">
    <div class="viewer">
      <button class="viewer-close" id="viewer-close" type="button" aria-label="关闭">✕</button>
      <button class="viewer-nav prev" id="viewer-prev" type="button" aria-label="上一张">‹</button>
      <div class="viewer-visual" id="viewer-visual"></div>
      <button class="viewer-nav next" id="viewer-next" type="button" aria-label="下一张">›</button>
      <div class="viewer-caption" id="viewer-caption"></div>
    </div>
  </dialog>
</body>
</html>
